[workspace]
members = [
    "crates/zen-engine",
    "crates/zen-opc",
    "crates/zen-drawing",
    "crates/zen-word",
    "crates/zen-slide",
    "crates/zen-formats",
    "crates/zen-ffi",
    "crates/zen-harness",
    "crates/zen-session",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ZenOffice Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
flate2 = "=1.1.10"
roxmltree = "=0.19.0"
thiserror = "2"
zen-opc = { path = "crates/zen-opc" }
zen-drawing = { path = "crates/zen-drawing" }
zen-word = { path = "crates/zen-word" }
zen-slide = { path = "crates/zen-slide" }
zen-engine = { path = "crates/zen-engine" }
zen-formats = { path = "crates/zen-formats" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
