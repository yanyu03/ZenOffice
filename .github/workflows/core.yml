name: Core baseline
on:
  push:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'tools/check_baseline.py', '.github/workflows/core.yml', 'docs/BASELINE_IMPORT.json', 'RCD/**']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'tools/check_baseline.py', '.github/workflows/core.yml', 'docs/BASELINE_IMPORT.json', 'RCD/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check baseline content
        run: python tools/check_baseline.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - name: Record compiler
        run: |
          rustc -Vv
          cargo -V
      - name: Build delivery command
        run: cargo build --locked --release -p zen-harness --bin zen-deliver
      - name: Run core tests
        run: |
          cargo test --locked --workspace --all-targets 2>&1 | Tee-Object -FilePath core-tests.log
          exit $LASTEXITCODE
      - name: Save resolved lock and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-baseline-evidence
          path: |
            Cargo.lock
            core-tests.log
      - name: Compare Zen business tasks with native Excel observations
        run: python tools/office_research/accept_zen_cases.py --binary target/debug/zen-session.exe --fixtures RCD/engine-acceptance/res-002-v1 --native docs/research/RES-002-EXCEL-2026-10-19.json --new-output target/eng004
      - name: Save business acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: business-acceptance-evidence
          path: target/eng004
