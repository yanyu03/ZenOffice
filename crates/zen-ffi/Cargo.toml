[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zen-engine = { path = "../zen-engine" }
zen-drawing = { path = "../zen-drawing" }
zen-word = { path = "../zen-word" }
zen-slide = { path = "../zen-slide" }
zen-formats = { path = "../zen-formats" }
zen-opc = { path = "../zen-opc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror.workspace = true

[dev-dependencies]
